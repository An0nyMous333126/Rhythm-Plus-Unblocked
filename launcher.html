<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rhythm Plus</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
    iframe{display:block;width:100%;height:100%;border:0}
    #msg{position:fixed;inset:0;display:grid;place-items:center;color:#fff;font:16px system-ui;background:#000}
  </style>
</head>
<body>
  <div id="msg">Opening Rhythm Plus…</div>
  <script>
    const game = new URLSearchParams(location.search).get('game');
    if (!game) {
      document.getElementById('msg').textContent =
        'Add ?game=YOUR_RHYTHM_PLUS_URL to this launcher.';
    } else {
      const win = window.open('about:blank', '_blank');
      if (!win) {
        document.getElementById('msg').textContent = 'Allow pop-ups for this portfolio site, then try again.';
      } else {
        const safe = game.replace(/&/g, '&amp;').replace(/"/g, '&quot;');
        win.document.open();
        win.document.write(`<!doctype html><html><head><title>Rhythm Plus</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}iframe{width:100%;height:100%;border:0}</style></head><body><iframe src="${safe}" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe></body></html>`);
        win.document.close();
        window.close();
      }
    }
  </script>
</body>
</html>
